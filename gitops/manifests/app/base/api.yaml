apiVersion: v1
kind: ServiceAccount
metadata:
  name: qoves-api
  namespace: qoves-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qoves-api
  namespace: qoves-app
  labels:
    app: qoves-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qoves-api
  template:
    metadata:
      labels:
        app: qoves-api
    spec:
      serviceAccountName: qoves-api
      containers:
        - name: api
          image: lokeshwarreddyyarava/qoves-api:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qoves-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: qoves-api
  namespace: qoves-app
  labels:
    app: qoves-api
spec:
  type: ClusterIP
  selector:
    app: qoves-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qoves-api
  namespace: qoves-app
spec:
  ingressClassName: nginx
  rules:
    - host: qoves.local
      http:
        paths:
          # pathType Prefix with path / forwards the full URI unchanged
          # (path rewriting annotations would collapse /healthz and /metrics to /)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qoves-api
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qoves-api
  namespace: qoves-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qoves-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
