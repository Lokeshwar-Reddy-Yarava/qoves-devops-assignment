apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: qoves-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: qoves-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - qoves-api.qoves-app.svc.cluster.local:80
  alerts.yml: |
    groups:
      - name: qoves-api
        rules:
          - alert: ApiDatabaseUnreachable
            expr: qoves_db_up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "QOVES API cannot reach Postgres"
              description: "qoves_db_up has been 0 for more than 5 minutes. Investigate DATABASE_URL, Postgres pod health, PVC, and NetworkPolicies."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: qoves-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: qoves-platform
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: qoves-platform
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-egress-to-api-and-dns
  namespace: qoves-platform
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qoves-app
          podSelector:
            matchLabels:
              app: qoves-api
      ports:
        # Client connects to Service port 80; backend container listens on 8080.
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
