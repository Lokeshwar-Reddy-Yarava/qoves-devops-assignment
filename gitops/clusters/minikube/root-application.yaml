apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qoves-minikube-root
  namespace: argocd
spec:
  project: default
  source:
    directory:
      recurse: true
    repoURL: https://github.com/Lokeshwar-Reddy-Yarava/qoves-devops-assignment.git
    targetRevision: HEAD
    path: gitops/clusters/minikube/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
